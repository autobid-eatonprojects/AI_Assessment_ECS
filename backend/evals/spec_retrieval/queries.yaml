# Eval set for spec retrieval recall — Elks Community Center Project Manual.
#
# Each query is a representative estimator question. Ground-truth `relevant_csi`
# is the set of CSI sections that SHOULD appear in retrieval results. A
# retrieval is judged "successful" if the chunks returned cover the relevant
# sections (recall@K).
#
# Difficulty tiers:
#   direct       — one specific section is the obvious answer (named in query)
#   material     — a material/product query that should pull 1-2 sections
#   cross_csi    — a concept that genuinely lives in multiple sections
#   ambiguous    — query has multiple equally-valid interpretations
#   compound     — combines two unrelated trades in one question
#   abbrev       — uses industry abbreviations (GWB, RTU, FCU, etc.)
#   no_match     — query about something the project doesn't cover (control)

queries:
