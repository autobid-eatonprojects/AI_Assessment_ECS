[project]
name = "ecs-estimator-backend"
version = "0.1.0"
description = "AI Estimating Agent — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "aiofiles>=24.1.0",
    "anthropic>=0.98.1",
    "pymupdf>=1.27.2.3",
    "pillow>=12.2.0",
    "openai>=2.34.0",
    "cohere>=6.1.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "google-genai>=1.75.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.4.2",
    "alembic>=1.18.4",
    "voyageai>=0.3.7",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
