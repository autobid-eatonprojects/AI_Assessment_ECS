# P4 — Industry-canonical AEC drawing-symbol → CSI 6-digit section map.
#
# This is the BOOTSTRAP dictionary loaded before any project's symbol
# legend is extracted. It seeds csi_section_hint for the most common
# AEC symbols so that:
#   - SymbolLegend rows whose vision pass didn't tag a csi_section_hint
#     can still be linked to a CSI bucket
#   - The discipline_agent has a baseline symbol→CSI mapping even when
#     a project's legend is partial or missing
#   - The link_judge can use it as a tier-3 (WEAK) signal: "the chunk
#     references a symbol whose canonical CSI matches the item's CSI"
#
# IMPORTANT: project-specific SymbolLegend.csi_section_hint always wins.
# This file is the FALLBACK when the project legend is silent.
#
# Many symbols are context-dependent (e.g. "DP" = Distribution Panel
# in Electrical, but Dry Pipe valve in Fire Protection; "FD" = Floor
# Drain in Plumbing, but Fire Damper in Mechanical). Each entry lists
# every plausible interpretation with the discipline that disambiguates.
# Lookup is keyed by (glyph, discipline) when the discipline is known.
#
# CSI codes follow the 2024 MasterFormat 6-digit "NN NN NN" convention.

